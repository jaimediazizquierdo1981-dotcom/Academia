<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia · Acceso</title>
<style>
  :root{
    --bg:#0b0e14;--panel:#141925;--ink:#E8ECF4;--muted:#8089a0;
    --line:#252c3c;--accent:#6E8BFF;--accent-2:#5FA869;--err:#E0605F;--radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
      radial-gradient(900px 500px at 80% -10%, #1a2238 0%, transparent 60%),
      radial-gradient(700px 400px at 0% 110%, #16241c 0%, transparent 55%),
      var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:grid;place-items:center;padding:1.5rem;overflow:hidden}
  .escena{position:relative;width:100%;max-width:760px;display:flex;align-items:center;
    justify-content:center;gap:1rem}
  .card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:2.2rem 2rem;box-shadow:0 20px 60px rgba(0,0,0,.4);
    z-index:2}
  .badge{font-family:ui-monospace,Menlo,monospace;font-size:.7rem;letter-spacing:.25em;
    text-transform:uppercase;color:var(--accent);margin:0 0 1.2rem}
  h1{font-size:1.5rem;margin:0 0 .3rem;letter-spacing:-.02em}
  p.sub{color:var(--muted);font-size:.9rem;margin:0 0 1.6rem}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.4rem}
  input{width:100%;background:#0d111a;border:1px solid var(--line);border-radius:10px;
    padding:.8rem .9rem;color:var(--ink);font-size:1rem;outline:none;transition:.15s}
  input:focus{border-color:var(--accent)}
  button{width:100%;margin-top:1.1rem;background:linear-gradient(135deg,var(--accent),#8a6eff);
    border:0;border-radius:10px;padding:.85rem;color:#fff;font-size:.95rem;font-weight:600;
    cursor:pointer;transition:.15s}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--err);font-size:.84rem;margin-top:.8rem;min-height:1.1em}
  .foot{margin-top:1.6rem;font-size:.74rem;color:var(--muted);text-align:center;line-height:1.5}

  /* ===== Personajes pixel art en los costados ===== */
  .mascota{position:relative;flex-shrink:0;display:flex;flex-direction:column;
    align-items:center;gap:8px;image-rendering:pixelated}
  .globo{background:#fff;color:#111;font-size:11px;font-weight:700;padding:6px 10px;
    border-radius:7px;font-family:ui-monospace,monospace;letter-spacing:.3px;
    text-align:center;position:relative;line-height:1.35}
  .globo::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-4px;
    border:5px solid transparent;border-top-color:#fff;border-bottom:0}
  .globo-perro{width:124px;white-space:normal;font-size:9.5px}
  .pers{animation:respira 1.6s ease-in-out infinite}
  .perro{animation:respira 1.3s ease-in-out infinite}
  @keyframes respira{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  /* en pantallas chicas, ocultar mascotas para no estorbar el login */
  @media (max-width:680px){.mascota{display:none}}
</style>
</head>
<body>
  <div class="escena">

    <!-- Personaje izquierda -->
    <div class="mascota">
      <div class="globo">Quiero<br>aprender</div>
      <svg class="pers" width="70" height="86" viewBox="0 0 17 21" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
        <rect x="5" y="0" width="7" height="2" fill="#4a6fd4"/>
        <rect x="4" y="2" width="9" height="2" fill="#5d82e8"/>
        <rect x="5" y="4" width="7" height="4" fill="#e8b890"/>
        <rect x="6" y="5" width="1" height="1" fill="#222"/>
        <rect x="10" y="5" width="1" height="1" fill="#222"/>
        <rect x="4" y="8" width="9" height="6" fill="#8b6fc9"/>
        <rect x="3" y="9" width="1" height="4" fill="#8b6fc9"/>
        <rect x="13" y="9" width="1" height="4" fill="#8b6fc9"/>
        <rect x="2" y="12" width="2" height="2" fill="#e8b890"/>
        <rect x="13" y="12" width="2" height="2" fill="#e8b890"/>
        <rect x="5" y="14" width="3" height="5" fill="#3a4a6a"/>
        <rect x="9" y="14" width="3" height="5" fill="#3a4a6a"/>
        <rect x="5" y="19" width="3" height="2" fill="#222"/>
        <rect x="9" y="19" width="3" height="2" fill="#222"/>
      </svg>
    </div>

    <!-- Tarjeta de login -->
    <div class="card">
      <p class="badge">Academia personal</p>
      <h1>Centro de aprendizaje</h1>
      <p class="sub">Ingresa tu clave para acceder a tus rutas y progreso.</p>
      <label for="pw">Clave de acceso</label>
      <input type="password" id="pw" autocomplete="current-password" placeholder="********" autofocus>
      <button id="btn">Entrar</button>
      <div class="err" id="err"></div>
      <p class="foot">Tu progreso se guarda de forma segura en el servidor.<br>Accede desde cualquier dispositivo.</p>
    </div>

    <!-- Perrito derecha -->
    <div class="mascota">
      <div class="globo globo-perro">Pirata, Mabe, Mock, Don Perro: somos un equipo</div>
      <svg class="perro" width="84" height="63" viewBox="0 0 16 12" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
        <!-- cuerpo gordito (blanco) -->
        <rect x="2" y="3" width="10" height="6" fill="#f0f0f0"/>
        <rect x="2" y="4" width="11" height="5" fill="#f5f5f5"/>
        <!-- panza -->
        <rect x="3" y="8" width="9" height="2" fill="#e2e2e2"/>
        <!-- cabeza (blanca) -->
        <rect x="10" y="1" width="5" height="5" fill="#f5f5f5"/>
        <!-- oreja (gris suave) -->
        <rect x="10" y="0" width="2" height="3" fill="#c8c8c8"/>
        <!-- ojo -->
        <rect x="13" y="2" width="1" height="1" fill="#222"/>
        <!-- hocico -->
        <rect x="14" y="3" width="1" height="2" fill="#444"/>
        <!-- patas gorditas -->
        <rect x="3" y="9" width="3" height="3" fill="#dcdcdc"/>
        <rect x="9" y="9" width="3" height="3" fill="#dcdcdc"/>
        <!-- cola -->
        <rect x="0" y="2" width="2" height="3" fill="#f5f5f5"/>
      </svg>
    </div>

  </div>
<script>
  const pw = document.getElementById('pw');
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  async function entrar(){
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Verificando...';
    try{
      const r = await fetch('/api/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: pw.value })
      });
      if(r.ok){
        window.location.href = '/';
      } else {
        const d = await r.json().catch(()=>({}));
        err.textContent = d.error || 'Clave incorrecta';
        btn.disabled = false;
        btn.textContent = 'Entrar';
        pw.value=''; pw.focus();
      }
    }catch(e){
      err.textContent = 'Error de conexion. Intenta de nuevo.';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  }
  btn.addEventListener('click', entrar);
  pw.addEventListener('keydown', e=>{ if(e.key==='Enter') entrar(); });
</script>
</body>
</html>
