<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia · Acceso</title>
<style>
  :root{
    --bg:#0b0e14;--panel:#141925;--ink:#E8ECF4;--muted:#8089a0;
    --line:#252c3c;--accent:#6E8BFF;--accent-2:#5FA869;--err:#E0605F;--radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
      radial-gradient(900px 500px at 80% -10%, #1a2238 0%, transparent 60%),
      radial-gradient(700px 400px at 0% 110%, #16241c 0%, transparent 55%),
      var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:grid;place-items:center;padding:1.5rem}
  .card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:2.2rem 2rem;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .badge{font-family:ui-monospace,Menlo,monospace;font-size:.7rem;letter-spacing:.25em;
    text-transform:uppercase;color:var(--accent);margin:0 0 1.2rem}
  h1{font-size:1.5rem;margin:0 0 .3rem;letter-spacing:-.02em}
  p.sub{color:var(--muted);font-size:.9rem;margin:0 0 1.6rem}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.4rem}
  input{width:100%;background:#0d111a;border:1px solid var(--line);border-radius:10px;
    padding:.8rem .9rem;color:var(--ink);font-size:1rem;outline:none;transition:.15s}
  input:focus{border-color:var(--accent)}
  button{width:100%;margin-top:1.1rem;background:linear-gradient(135deg,var(--accent),#8a6eff);
    border:0;border-radius:10px;padding:.85rem;color:#fff;font-size:.95rem;font-weight:600;
    cursor:pointer;transition:.15s}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.6;cursor:default}
  .err{color:var(--err);font-size:.84rem;margin-top:.8rem;min-height:1.1em}
  .foot{margin-top:1.6rem;font-size:.74rem;color:var(--muted);text-align:center;line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <p class="badge">Academia personal</p>
    <h1>Centro de aprendizaje</h1>
    <p class="sub">Ingresa tu clave para acceder a tus rutas y progreso.</p>
    <label for="pw">Clave de acceso</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="********" autofocus>
    <button id="btn">Entrar</button>
    <div class="err" id="err"></div>
    <p class="foot">Tu progreso se guarda de forma segura en el servidor.<br>Accede desde cualquier dispositivo.</p>
  </div>
<script>
  const pw = document.getElementById('pw');
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  async function entrar(){
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Verificando...';
    try{
      const r = await fetch('/api/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: pw.value })
      });
      if(r.ok){
        window.location.href = '/';
      } else {
        const d = await r.json().catch(()=>({}));
        err.textContent = d.error || 'Clave incorrecta';
        btn.disabled = false;
        btn.textContent = 'Entrar';
        pw.value=''; pw.focus();
      }
    }catch(e){
      err.textContent = 'Error de conexion. Intenta de nuevo.';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  }
  btn.addEventListener('click', entrar);
  pw.addEventListener('keydown', e=>{ if(e.key==='Enter') entrar(); });
</script>
</body>
</html>
